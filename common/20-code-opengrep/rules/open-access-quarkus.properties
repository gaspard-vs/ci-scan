# ruleid: open-access-quarkus
quarkus.http.auth.permission.all.paths=/*
quarkus.http.auth.permission.all.policy=permit

# ruleid: open-access-quarkus
quarkus.http.auth.permission.reverse.policy=permit
quarkus.http.auth.permission.reverse.methods=GET
quarkus.http.auth.permission.reverse.paths=/api/*,/*

# ok: open-access-quarkus
quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit

# ok: open-access-quarkus
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# ok: open-access-quarkus
%dev.quarkus.http.auth.permission.local.paths=/*
%dev.quarkus.http.auth.permission.local.policy=permit
