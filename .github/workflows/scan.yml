# The scan that other repositories call. It reads the code of the pull
# request and never runs it.
name: scan

on:
  workflow_call:

permissions:
  contents: read

env:
  # The file of the calling repository that starts this scan.
  CALL_FILE: .github/workflows/ci-scan.yml

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      # The code to scan.
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          persist-credentials: false

      # CI scan itself: the runner, the stages and the policy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gaspard-vs/ci-scan
          ref: main
          path: ci-scan
          persist-credentials: false

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      # The call file as it is on the branch that receives the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event.pull_request
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          sparse-checkout: ${{ env.CALL_FILE }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # A pull request cannot change or remove the call file. The two
      # versions are compared as git objects: no file of the pull request is
      # opened, and a symbolic link does not pass.
      - name: Guard the call file
        if: github.event.pull_request
        run: |
          entry() { git -C "$1" ls-tree HEAD -- "$CALL_FILE" | cut -f1; }
          expected=$(entry base)
          actual=$(entry target)
          if [ -z "$expected" ]; then
            echo "::error::The call file $CALL_FILE is not on the base branch"
            exit 1
          elif [ -z "$actual" ]; then
            echo "::error::The pull request removes the call file $CALL_FILE"
            exit 1
          elif [ "$actual" != "$expected" ]; then
            echo "::error file=$CALL_FILE::The pull request changes the call file"
            exit 1
          fi
          echo "The call file is the same as on the base branch"

      # The runner starts each tool in its own container. A container can
      # write nowhere: the code is mounted read-only, its own file system is
      # read-only, and the result leaves on the standard output.
      # The scan also runs when the guard fails, to show all the faults.
      - name: Scan
        if: ${{ !cancelled() }}
        run: node ci-scan/runner/cli.mjs target --out "$RUNNER_TEMP/ci-scan"

      # The SARIF and the SBOM (sbom.cdx.json) stay with the run, also when
      # the scan blocks. GitHub keeps them 90 days at most. The central store
      # of the SBOMs comes later.
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: ci-scan
          path: ${{ runner.temp }}/ci-scan
          if-no-files-found: warn
