# Each month, checks if GitLab has new SAST rules. If so, it opens an issue
# (or updates the open one). It only reads: it does not download the rules
# and cannot change the code of CI scan. A person copies the rules with
# `update-rules.sh` and opens the pull request.
name: update-rules

on:
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  REPOSITORY: https://gitlab.com/gitlab-org/security-products/sast-rules
  TITLE: New GitLab rules

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: common/20-code-opengrep/gitlab/SOURCE.json
          sparse-checkout-cone-mode: false

      - name: Compare the commits, and open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ours=$(jq -r .commit common/20-code-opengrep/gitlab/SOURCE.json)
          theirs=$(git ls-remote "$REPOSITORY.git" HEAD | cut -f1)
          echo "Our commit: $ours"
          echo "GitLab:     $theirs"
          if ! echo "$theirs" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::No commit from GitLab"
            exit 1
          fi
          if [ "$ours" = "$theirs" ]; then
            echo "The rules are up to date."
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<EOF
          GitLab has new SAST rules.

          | | Commit |
          | --- | --- |
          | Ours | \`$ours\` |
          | GitLab | \`$theirs\` |

          The changes: $REPOSITORY/-/compare/$ours...$theirs

          To update, on a workstation:

          1. \`common/20-code-opengrep/update-rules.sh $theirs\`
          2. \`npm test\`. A rule that Opengrep cannot read goes in \`common/20-code-opengrep/gitlab-excluded.txt\`, with the reason.
          3. Open a pull request. The owner of CI scan reads it and merges it.
          EOF
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated issue #$number"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
