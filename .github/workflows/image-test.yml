# Proves that one job can run a tool image, fixed by digest, on a repository
# and read its SARIF result.
name: image-test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # ghcr.io/gitleaks/gitleaks:v8.30.1
  GITLEAKS: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  image-test:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run the image on each fixture
        run: |
          mkdir -p out
          for fixture in secret clean; do
            docker run --rm --network none \
              --user "$(id -u):$(id -g)" \
              -v "$PWD/fixtures/$fixture:/repo:ro" \
              -v "$PWD/out:/out" \
              "$GITLEAKS" dir /repo \
              --no-banner --exit-code 0 \
              --report-format sarif --report-path "/out/$fixture.sarif"
          done

      - name: Check the results
        run: |
          status=0
          check() {
            found=$(jq '[.runs[].results[]] | length' "out/$1.sarif")
            if [ "$found" = "$2" ]; then
              echo "ok: $1 has $found finding(s)"
            else
              echo "::error::$1 has $found finding(s), expected $2"
              status=1
            fi
          }
          check secret 1
          check clean 0
          exit $status
